plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shen.wordcheck'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shen.wordcheck'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // 固定签名：每次 Actions 编出来的 APK 签名一致，覆盖安装不会丢数据
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
