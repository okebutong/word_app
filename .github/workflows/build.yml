name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WordCheck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WordCheck-apk
          path: WordCheck.apk

      # 发布到 Releases，手机浏览器可直接下载 APK
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WordCheck latest
          files: WordCheck.apk
          make_latest: true
